# Render Blueprint - 一键部署配置
# 使用方法: render blueprint render.yaml

services:
  # Web 应用服务
  - type: web
    name: video-platform
    runtime: docker
    dockerfilePath: ./deploy/Dockerfile
    rootDir: ./
    plan: free
    region: oregon
    branch: main
    envVars:
      - key: FLASK_ENV
        value: production
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: SECRET_KEY
        sync: false
      - key: WEB_CONCURRENCY
        value: "2"

  # PostgreSQL 数据库 (可选)
  # 取消注释以启用数据库
  # - type: postgres
  #   name: video-db
  #   plan: free
  #   databaseName: video_platform
